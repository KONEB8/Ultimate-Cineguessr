<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Угадай фильм</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            padding: 16px;
            max-width: 1000px;
            margin: 0 auto;
            color: #1a1a2e;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 16px;
        }
        @media(max-width:750px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #e4e6eb;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .card h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #333;
        }
        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .input-group input {
            flex: 1;
            min-width: 80px;
            padding: 7px 10px;
            border: 1px solid #d0d4dc;
            border-radius: 6px;
            font-size: 13px;
            background: #fafbfc;
        }
        .input-group input:focus {
            outline: none;
            border-color: #ff6b35;
        }
        .input-group button {
            padding: 7px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            background: #ff6b35;
            color: #fff;
            white-space: nowrap;
        }
        .input-group button:hover {
            background: #e55a2b;
        }
        .input-group button.green {
            background: #2ecc71;
        }
        .input-group button.green:hover {
            background: #27ae60;
        }
        .input-group button.blue {
            background: #3498db;
        }
        .input-group button.blue:hover {
            background: #2980b9;
        }
        .input-group button.gray {
            background: #6c7a8d;
        }
        .input-group button.gray:hover {
            background: #5a687a;
        }
        .input-group button.red {
            background: #e74c3c;
        }
        .input-group button.red:hover {
            background: #c0392b;
        }
        .frames-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 10px 0;
            min-height: 150px;
        }
        .frame-card {
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e4e6eb;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 150px;
            overflow: hidden;
        }
        .frame-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .frame-card .no-image {
            color: #999;
            font-size: 13px;
            padding: 20px;
            text-align: center;
        }
        .film-info {
            background: #f8f9fa;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #e4e6eb;
            margin: 8px 0;
        }
        .film-info .hidden-title {
            font-size: 18px;
            font-weight: bold;
            color: #999;
            letter-spacing: 6px;
            background: #e9ecef;
            padding: 2px 12px;
            border-radius: 4px;
            display: inline-block;
        }
        .film-info .revealed-title {
            font-size: 20px;
            font-weight: bold;
            color: #2ecc71;
        }
        .film-info .meta {
            font-size: 13px;
            color: #555;
            margin-top: 4px;
        }
        .film-info .meta span {
            margin-right: 12px;
        }
        .guess-area {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0;
        }
        .guess-area input {
            flex: 1;
            min-width: 120px;
            padding: 8px 12px;
            border: 1px solid #d0d4dc;
            border-radius: 6px;
            font-size: 14px;
        }
        .guess-area input:focus {
            outline: none;
            border-color: #ff6b35;
        }
        .guess-area button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .guess-area button.guess {
            background: #2ecc71;
            color: #fff;
        }
        .guess-area button.guess:hover {
            background: #27ae60;
        }
        .guess-area button.gray {
            background: #6c7a8d;
            color: #fff;
        }
        .guess-area button.gray:hover {
            background: #5a687a;
        }
        .guess-area button.orange {
            background: #f39c12;
            color: #fff;
        }
        .guess-area button.orange:hover {
            background: #e67e22;
        }
        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e4e6eb;
            margin: 8px 0;
            font-size: 13px;
        }
        .stats-bar .stat-item .value {
            font-weight: 700;
            font-size: 16px;
        }
        .stats-bar .stat-item .value.errors {
            color: #e74c3c;
        }
        .stats-bar .stat-item .value.wins {
            color: #2ecc71;
        }
        .feedback {
            padding: 10px 14px;
            border-radius: 8px;
            margin: 8px 0;
            background: #f8f9fa;
            border: 1px solid #e4e6eb;
            min-height: 38px;
            font-size: 14px;
        }
        .feedback.success {
            background: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }
        .feedback.error {
            background: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
        .feedback.loading {
            background: #e2e3e5;
            border-color: #d6d8db;
            color: #383d41;
        }
        .feedback.info {
            background: #d1ecf1;
            border-color: #bee5eb;
            color: #0c5460;
        }
        .chat-container {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e4e6eb;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 400px;
        }
        .chat-header {
            padding: 10px 14px;
            background: #f8f9fa;
            border-bottom: 1px solid #e4e6eb;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }
        .chat-messages {
            flex: 1;
            padding: 10px 14px;
            overflow-y: auto;
            max-height: 350px;
            min-height: 150px;
            font-size: 13px;
        }
        .chat-messages .msg {
            padding: 3px 6px;
            margin-bottom: 2px;
            border-radius: 4px;
        }
        .chat-messages .msg.system {
            background: #f8f9fa;
            color: #666;
            font-style: italic;
            font-size: 12px;
        }
        .chat-messages .msg .name {
            font-weight: 600;
        }
        .chat-messages .msg .name.me {
            color: #3498db;
        }
        .chat-messages .msg .name.you {
            color: #ff6b35;
        }
        .chat-input {
            display: flex;
            gap: 6px;
            padding: 8px 14px;
            border-top: 1px solid #e4e6eb;
        }
        .chat-input input {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid #d0d4dc;
            border-radius: 6px;
            font-size: 13px;
        }
        .chat-input button {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            background: #ff6b35;
            color: #fff;
            cursor: pointer;
        }
        .room-code {
            font-family: monospace;
            font-size: 24px;
            font-weight: 700;
            color: #ff6b35;
            letter-spacing: 4px;
            padding: 4px 16px;
            background: #fff5f0;
            border-radius: 8px;
            display: inline-block;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .status-dot.online {
            background: #2ecc71;
        }
        .status-dot.offline {
            background: #e74c3c;
        }
        .status-dot.waiting {
            background: #f39c12;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        .footer {
            margin-top: 16px;
            font-size: 12px;
            color: #888;
            text-align: center;
            border-top: 1px solid #e4e6eb;
            padding-top: 12px;
        }
        .inline-flex {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .hidden {
            display: none !important;
        }
        @media(max-width:600px) {
            .frames-grid {
                grid-template-columns: 1fr;
            }
            .frame-card img {
                height: 140px;
            }
            .guess-area {
                flex-direction: column;
            }
            .guess-area input {
                width: 100%;
            }
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:12px;">
        <h1 style="font-size:24px;">🎬 Угадай фильм</h1>
        <div class="inline-flex">
            <span id="roomDisplay" style="font-size:13px;color:#888;display:none;">Код: <span class="room-code" id="roomCodeDisplay">----</span></span>
            <span id="playerCount" style="font-size:13px;color:#888;">👤 1</span>
            <span id="statusDot" class="status-dot offline"></span>
        </div>
    </div>

    <div class="main-grid">
        <div>
            <!-- Ключи -->
            <div class="card">
                <div class="input-group">
                    <input type="text" id="omdbKey" placeholder="OMDb ключ" value="eadc65c8">
                    <input type="text" id="kpKey" placeholder="KP ключ" value="5e8d3a33-e69d-46b0-b5a2-326310ba29e7">
                    <button id="testBtn">Проверить</button>
                </div>
                <div id="keyStatus" style="font-size:12px;color:#888;margin-top:4px;">⏳ Введите ключи</div>
            </div>

            <!-- Комната -->
            <div class="card">
                <div class="input-group">
                    <input type="text" id="roomInput" placeholder="4 цифры" maxlength="4" style="max-width:100px;">
                    <button id="createBtn" class="green">Создать</button>
                    <button id="joinBtn" class="blue">Войти</button>
                    <button id="leaveBtn" class="red hidden">Выйти</button>
                </div>
                <div id="roomInfo" style="font-size:12px;color:#888;margin-top:4px;">💡 Создайте комнату (4 цифры)</div>
                <div id="connectStatus" style="font-size:12px;margin-top:4px;"></div>
            </div>

            <!-- Игра -->
            <div class="card">
                <div class="stats-bar">
                    <span class="stat-item">🎯 <span class="value" id="attempts">0</span></span>
                    <span class="stat-item">✅ <span class="value wins" id="wins">0</span></span>
                    <span class="stat-item">❌ <span class="value errors" id="errors">0</span></span>
                    <button id="resetStats" style="margin-left:auto;padding:2px 10px;border:none;border-radius:4px;background:#e4e6eb;cursor:pointer;font-size:12px;">Сброс</button>
                </div>

                <div class="frames-grid" id="frames">
                    <div class="frame-card"><div class="no-image">Загрузите фильм</div></div>
                    <div class="frame-card"><div class="no-image">Загрузите фильм</div></div>
                    <div class="frame-card"><div class="no-image">Загрузите фильм</div></div>
                </div>

                <div class="film-info">
                    <div id="titleDisplay" class="hidden-title">???</div>
                    <div class="meta">
                        <span id="fYear">📅 —</span>
                        <span id="fGenre">🎭 —</span>
                        <span id="fRuntime">⏱️ —</span>
                        <span id="fRating">⭐ —</span>
                        <span id="fDirector">🎬 —</span>
                    </div>
                </div>

                <div class="guess-area">
                    <input type="text" id="guessInput" placeholder="Название...">
                    <button class="guess" id="guessBtn">Угадать</button>
                    <button class="gray" id="skipBtn">Пропустить</button>
                    <button class="gray" id="newBtn">Случайный</button>
                    <button class="orange" id="easyBtn">Лёгкий</button>
                </div>

                <div class="feedback" id="feedback">💡 Создайте или войдите в комнату</div>
            </div>
        </div>

        <!-- Чат -->
        <div class="chat-container">
            <div class="chat-header">
                💬 Чат
                <span id="onlineCount">👤 0</span>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="msg system">💡 Создайте или войдите в комнату</div>
            </div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Сообщение..." disabled>
                <button id="chatSend" disabled>📤</button>
            </div>
        </div>
    </div>

    <div class="footer">OMDb + Kinopoisk API · PeerJS (WebRTC)</div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js">
    </script>
    <script>
        // ============================================================
        //  КОНЕЧНАЯ ВЕРСИЯ — БЕЗ ПОДСКАЗОК И КНОПКИ «ПОДБОР»
        // ============================================================

        const OMDB = 'https://www.omdbapi.com/';
        const KP = 'https://kinopoiskapiunofficial.tech/api';
        const WORDS = ['love', 'star', 'man', 'world', 'time', 'night', 'day', 'life', 'great', 'good', 'city', 'family', 'home',
            'war', 'peace', 'movie', 'film'
        ];

        // ---------- DOM ----------
        const $ = id => document.getElementById(id);
        const omdbKey = $('omdbKey'),
            kpKey = $('kpKey'),
            testBtn = $('testBtn'),
            keyStatus = $('keyStatus');
        const roomInput = $('roomInput'),
            createBtn = $('createBtn'),
            joinBtn = $('joinBtn'),
            leaveBtn = $('leaveBtn'),
            roomInfo = $('roomInfo'),
            connectStatus = $('connectStatus'),
            roomCodeDisplay = $('roomCodeDisplay'),
            roomDisplay = $('roomDisplay'),
            playerCount = $('playerCount'),
            statusDot = $('statusDot');
        const frames = $('frames'),
            titleDisplay = $('titleDisplay'),
            fYear = $('fYear'),
            fGenre = $('fGenre'),
            fRuntime = $('fRuntime'),
            fRating = $('fRating'),
            fDirector = $('fDirector');
        const guessInput = $('guessInput'),
            guessBtn = $('guessBtn'),
            skipBtn = $('skipBtn'),
            newBtn = $('newBtn'),
            easyBtn = $('easyBtn');
        const feedback = $('feedback');
        const chatMessages = $('chatMessages'),
            chatInput = $('chatInput'),
            chatSend = $('chatSend'),
            onlineCount = $('onlineCount');
        const attemptsEl = $('attempts'),
            winsEl = $('wins'),
            errorsEl = $('errors'),
            resetStats = $('resetStats');

        // ---------- СОСТОЯНИЕ ----------
        let film = null,
            filmId = null,
            guessed = false,
            loading = false,
            easyMode = false;
        let stats = JSON.parse(localStorage.getItem('stats') || '{"a":0,"w":0,"e":0}');
        let myName = 'Игрок' + Math.floor(Math.random() * 100);
        let room = null,
            isHost = false,
            isConnected = false;
        let myId = 'p' + Date.now() + Math.random().toString(36).slice(2, 6);

        // PeerJS
        let peer = null;
        let conn = null;
        let players = {};
        let connectTimeout = null;
        let isConnecting = false;

        // ---------- СТАТИСТИКА ----------
        function updateStats() {
            attemptsEl.textContent = stats.a;
            winsEl.textContent = stats.w;
            errorsEl.textContent = stats.e;
            localStorage.setItem('stats', JSON.stringify(stats));
        }
        updateStats();

        function addAttempt() { stats.a++;
            updateStats(); }

        function addWin() { stats.w++;
            updateStats(); }

        function addError() { stats.e++;
            updateStats(); }

        resetStats.onclick = () => { stats = { a: 0, w: 0, e: 0 };
            updateStats();
            addChat('📊 Статистика сброшена', 'system'); };

        // ---------- ЧАТ ----------
        function addChat(text, type = '', player = null) {
            const d = document.createElement('div');
            d.className = 'msg' + (type ? ' ' + type : '');
            if (player) {
                const n = document.createElement('span');
                n.className = 'name' + (player === myName ? ' me' : ' you');
                n.textContent = player + ' ';
                d.appendChild(n);
            }
            const t = document.createElement('span');
            t.innerHTML = text;
            d.appendChild(t);
            chatMessages.appendChild(d);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function updateOnline() {
            const count = Object.keys(players).length || (isConnected ? 1 : 0);
            onlineCount.textContent = '👤 ' + count;
            playerCount.textContent = '👤 ' + count;
        }

        // ---------- КЛЮЧИ ----------
        function getOmdb() { return omdbKey.value.trim() || localStorage.getItem('omdb') || ''; }

        function getKp() { return kpKey.value.trim() || localStorage.getItem('kp') || ''; }

        function saveKeys() {
            if (omdbKey.value.trim()) localStorage.setItem('omdb', omdbKey.value.trim());
            if (kpKey.value.trim()) localStorage.setItem('kp', kpKey.value.trim());
        }
        omdbKey.onchange = saveKeys;
        kpKey.onchange = saveKeys;

        testBtn.onclick = async function() {
            const o = getOmdb(),
                k = getKp();
            if (!o || !k) { keyStatus.textContent = '❌ Введите оба ключа'; return; }
            keyStatus.textContent = '⏳ Проверка...';
            try {
                const r1 = await fetch(OMDB + '?apikey=' + o + '&t=Inception');
                const d1 = await r1.json();
                if (d1.Response === 'False') { keyStatus.textContent = '❌ OMDb не работает'; return; }
                const r2 = await fetch(KP + '/v2.2/films/301', { headers: { 'X-API-KEY': k } });
                if (!r2.ok) { keyStatus.textContent = '❌ KP не работает'; return; }
                keyStatus.textContent = '✅ Ключи работают!';
                feedback.textContent = '✅ Ключи работают!';
                feedback.className = 'feedback success';
            } catch (e) { keyStatus.textContent = '❌ Ошибка: ' + e.message; }
        };

        // ---------- API ----------
        async function kpSearch(title) {
            const k = getKp();
            if (!k) return null;
            try {
                const r = await fetch(KP + '/v2.1/films/search-by-keyword?keyword=' + encodeURIComponent(title), { headers: { 'X-API-KEY': k } });
                const d = await r.json();
                if (d.films && d.films.length) return d.films.find(f => f.filmId) || d.films[0];
                return null;
            } catch (e) { return null; }
        }

        async function kpFilm(id) {
            try {
                const r = await fetch(KP + '/v2.2/films/' + id, { headers: { 'X-API-KEY': getKp() } });
                return await r.json();
            } catch (e) { return null; }
        }

        async function kpFrames(id) {
            try {
                const r = await fetch(KP + '/v2.2/films/' + id + '/images', { headers: { 'X-API-KEY': getKp() } });
                const d = await r.json();
                if (!d.items) return [];
                let f = d.items.filter(i => ['SCREENSHOT', 'FRAME', 'STILL', 'SHOT'].includes((i.type || '').toUpperCase()))
                    .map(i => i.imageUrl).filter(u => u);
                if (f.length) return f;
                f = d.items.filter(i => !['POSTER', 'COVER', 'DVD'].includes((i.type || '').toUpperCase()))
                    .map(i => i.imageUrl).filter(u => u);
                if (f.length) return f;
                return d.items.map(i => i.imageUrl).filter(u => u);
            } catch (e) { return []; }
        }

        async function omdbMovie(id) {
            try {
                const r = await fetch(OMDB + '?apikey=' + getOmdb() + '&i=tt' + id);
                const d = await r.json();
                if (d.Response === 'True') return d;
                return null;
            } catch (e) { return null; }
        }

        function randImdb() {
            return String(Math.floor(Math.random() * 20000000) + 1).padStart(7, '0');
        }

        // ============================================================
        //  ИГРОВАЯ ЛОГИКА
        // ============================================================

        function getDirectorFromKP(filmData) {
            if (!filmData || !filmData.persons) return '—';
            const dir = filmData.persons.find(p => p.professionKey === 'DIRECTOR');
            return dir ? (dir.nameRu || dir.nameEn || '—') : '—';
        }

        function showFilm(data) {
            if (!data) {
                titleDisplay.className = 'hidden-title';
                titleDisplay.textContent = '???';
                fYear.textContent = '📅 —';
                fGenre.textContent = '🎭 —';
                fRuntime.textContent = '⏱️ —';
                fRating.textContent = '⭐ —';
                fDirector.textContent = '🎬 —';
                return;
            }

            fYear.textContent = '📅 ' + (data.year || '—');
            const genres = data.genres ? data.genres.map(g => g.genre).join(', ') : '—';
            fGenre.textContent = '🎭 ' + genres;
            fRuntime.textContent = '⏱️ ' + (data.filmLength ? data.filmLength + ' мин' : '—');
            fRating.textContent = '⭐ —';
            fDirector.textContent = '🎬 —';

            titleDisplay.className = 'hidden-title';
            titleDisplay.textContent = '???';
        }

        function showFrames(imgs) {
            frames.innerHTML = '';
            if (!imgs || !imgs.length) {
                for (let i = 0; i < 3; i++) {
                    const c = document.createElement('div');
                    c.className = 'frame-card';
                    c.innerHTML = '<div class="no-image">🖼️ Кадр не найден</div>';
                    frames.appendChild(c);
                }
                return;
            }
            const s = imgs.slice(0, 3);
            while (s.length < 3) s.push(null);
            s.forEach(u => {
                const c = document.createElement('div');
                c.className = 'frame-card';
                if (u) {
                    const img = document.createElement('img');
                    img.src = u;
                    img.onerror = function() { this.style.display = 'none';
                        c.innerHTML = '<div class="no-image">❌ Ошибка</div>'; };
                    c.appendChild(img);
                } else {
                    c.innerHTML = '<div class="no-image">🖼️ Нет кадра</div>';
                }
                frames.appendChild(c);
            });
        }

        function revealTitle(name) {
            titleDisplay.className = 'revealed-title';
            titleDisplay.textContent = name;
        }

        // ============================================================
        //  ЗАГРУЗКА ФИЛЬМА
        // ============================================================
        async function loadFilm(mode) {
            const o = getOmdb(),
                k = getKp();
            if (!o || !k) { feedback.textContent = '❌ Введите API ключи';
                feedback.className = 'feedback error'; return; }
            if (loading) return;
            loading = true;
            guessed = false;
            easyMode = mode === 'easy';

            feedback.textContent = '⏳ Загрузка...';
            feedback.className = 'feedback loading';
            guessInput.disabled = true;
            guessBtn.disabled = true;
            showFilm(null);
            frames.innerHTML =
                '<div class="frame-card"><div class="no-image">⏳ Загрузка...</div></div>'.repeat(3);

            try {
                let kpMovie = null,
                    id = null;

                if (easyMode) {
                    let found = null;
                    for (let i = 0; i < 5 && !found; i++) {
                        const w = WORDS[Math.floor(Math.random() * WORDS.length)];
                        const s = await kpSearch(w);
                        if (s && s.filmId) {
                            const fr = await kpFrames(s.filmId);
                            if (fr.length) { found = s; }
                        }
                    }
                    if (!found) { feedback.textContent = '❌ Не найден';
                        feedback.className = 'feedback error';
                        loading = false;
                        guessInput.disabled = false;
                        guessBtn.disabled = false; return; }
                    id = found.filmId;
                    kpMovie = await kpFilm(id);
                } else {
                    let found = false;
                    for (let i = 0; i < 10 && !found; i++) {
                        const imdb = randImdb();
                        const omdbResult = await omdbMovie(imdb);
                        if (omdbResult) {
                            const s = await kpSearch(omdbResult.Title);
                            if (s && s.filmId) {
                                const fr = await kpFrames(s.filmId);
                                if (fr.length) {
                                    id = s.filmId;
                                    kpMovie = await kpFilm(id);
                                    found = true;
                                }
                            }
                        }
                    }
                    if (!found) { feedback.textContent = '❌ Не найден';
                        feedback.className = 'feedback error';
                        loading = false;
                        guessInput.disabled = false;
                        guessBtn.disabled = false; return; }
                }

                if (!kpMovie) { feedback.textContent = '❌ Ошибка загрузки';
                    feedback.className = 'feedback error';
                    loading = false;
                    guessInput.disabled = false;
                    guessBtn.disabled = false; return; }

                film = kpMovie;
                filmId = id;

                showFilm(kpMovie);

                const fr = await kpFrames(id);
                if (fr.length) {
                    showFrames(fr);
                    const name = kpMovie.nameRu || kpMovie.nameEn || 'Без названия';
                    feedback.textContent = '🎬 Какой фильм? (' + Math.min(fr.length, 3) + ' кадров)';
                    feedback.className = 'feedback info';
                } else {
                    showFrames([]);
                    feedback.textContent = '🖼️ Кадры не найдены';
                    feedback.className = 'feedback error';
                }

                if (isConnected) syncGame();

            } catch (e) { feedback.textContent = '❌ ' + e.message;
                feedback.className = 'feedback error'; }
            loading = false;
            guessInput.disabled = false;
            guessBtn.disabled = false;
            guessInput.focus();
        }

        newBtn.onclick = () => loadFilm('random');
        easyBtn.onclick = () => loadFilm('easy');

        // ============================================================
        //  УГАДЫВАНИЕ
        // ============================================================
        function checkGuess(guessText) {
            if (!film) return false;

            const guess = guessText.trim().toLowerCase();
            if (!guess) return false;

            const titles = [];
            if (film.nameRu) titles.push(film.nameRu.toLowerCase());
            if (film.nameEn) titles.push(film.nameEn.toLowerCase());
            if (film.alternativeName) titles.push(film.alternativeName.toLowerCase());

            for (const title of titles) {
                if (!title) continue;
                if (guess === title) return true;
                if (guess.length >= 3 && title.includes(guess)) return true;
                if (title.length >= 3 && guess.includes(title)) return true;
            }

            return false;
        }

        function handleGuess() {
            if (loading || !film) { feedback.textContent = '❌ Сначала загрузите фильм';
                feedback.className = 'feedback error'; return; }
            if (guessed) { feedback.textContent = '✅ Вы уже угадали!';
                feedback.className = 'feedback success'; return; }

            const g = guessInput.value.trim();
            if (!g) { feedback.textContent = '✏️ Введите название';
                feedback.className = 'feedback error'; return; }

            const isCorrect = checkGuess(g);
            const displayName = film.nameRu || film.nameEn || 'Без названия';

            addAttempt();
            if (isCorrect) {
                guessed = true;
                addWin();
                revealTitle(displayName);
                feedback.textContent = '🎉 Правильно! "' + displayName + '"!';
                feedback.className = 'feedback success';
                guessInput.disabled = true;
                guessBtn.disabled = true;
                if (isConnected) {
                    sendToPeer('guess', { name: myName, guess: g, win: true });
                    addChat('🎯 <strong>' + myName + '</strong> угадал!', 'system');
                }
                if (isConnected) syncGame();
            } else {
                addError();
                feedback.textContent = '❌ Не угадал. Ошибок: ' + stats.e;
                feedback.className = 'feedback error';
                guessInput.value = '';
                guessInput.focus();
                if (isConnected) {
                    sendToPeer('guess', { name: myName, guess: g, win: false });
                    addChat('❌ <strong>' + myName + '</strong>: ' + g + ' — не угадал', '');
                }
            }
        }

        guessBtn.onclick = handleGuess;
        guessInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault();
                handleGuess(); } });

        // ---------- ПРОПУСК ----------
        skipBtn.onclick = function() {
            if (!film || guessed) return;
            const name = film.nameRu || film.nameEn || 'Без названия';
            revealTitle(name);
            guessed = true;
            addAttempt();
            feedback.textContent = '⏭️ Это был "' + name + '"';
            feedback.className = 'feedback info';
            guessInput.disabled = true;
            guessBtn.disabled = true;
            if (isConnected) {
                sendToPeer('skip', { name: myName, title: name });
                addChat('⏭️ <strong>' + myName + '</strong> пропустил. Это был "' + name + '"', 'system');
            }
            if (isConnected) syncGame();
        };

        // ============================================================
        //  МУЛЬТИПЛЕЕР
        // ============================================================

        function syncGame() {
            if (!isConnected || !conn || !conn.open) return;
            const data = {
                film: film,
                filmId: filmId,
                guessed: guessed,
                players: players
            };
            sendToPeer('sync', data);
        }

        function sendToPeer(type, data) {
            if (!conn || !conn.open) return;
            try {
                conn.send({ type: type, data: data, from: myId, name: myName });
            } catch (e) {
                console.error('Ошибка отправки:', e);
            }
        }

        function initPeer() {
            if (peer) {
                try { peer.destroy(); } catch (e) {}
                peer = null;
            }

            const peerId = isHost ? room : undefined;

            peer = new Peer(peerId, {
                debug: 0,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            if (connectTimeout) clearTimeout(connectTimeout);
            connectTimeout = setTimeout(() => {
                if (!isConnected && isConnecting) {
                    isConnecting = false;
                    connectStatus.textContent = '❌ Таймаут подключения. Попробуйте ещё раз.';
                    connectStatus.style.color = '#e74c3c';
                    feedback.textContent = '❌ Таймаут подключения';
                    feedback.className = 'feedback error';
                    if (peer) { try { peer.destroy(); } catch (e) {} }
                    peer = null;
                    createBtn.style.display = 'inline-block';
                    joinBtn.style.display = 'inline-block';
                    leaveBtn.classList.add('hidden');
                }
            }, 10000);

            peer.on('open', (id) => {
                console.log('Peer открыт:', id);
                isConnecting = false;
                if (connectTimeout) clearTimeout(connectTimeout);

                if (isHost) {
                    const shortId = id.slice(0, 8);
                    roomCodeDisplay.textContent = shortId;
                    roomDisplay.style.display = 'inline-flex';
                    connectStatus.textContent = '✅ Ожидание подключения... Код: ' + shortId;
                    connectStatus.style.color = '#f39c12';
                    statusDot.className = 'status-dot waiting';
                    roomInfo.innerHTML = '🏠 Вы хост. Код: <strong>' + shortId + '</strong>';
                    feedback.textContent = '✅ Комната создана. Ждите игроков.';
                    feedback.className = 'feedback success';
                }
            });

            peer.on('connection', (c) => {
                console.log('Входящее подключение от:', c.peer);
                if (isHost) {
                    conn = c;
                    setupConnection(c);
                }
            });

            peer.on('error', (err) => {
                console.error('Peer ошибка:', err);
                if (isConnecting) {
                    isConnecting = false;
                    if (err.type === 'unavailable-id') {
                        connectStatus.textContent = '❌ Код уже используется. Попробуйте другой.';
                        connectStatus.style.color = '#e74c3c';
                        feedback.textContent = '❌ Код занят. Попробуйте другой.';
                        feedback.className = 'feedback error';
                    } else if (err.type === 'peer-unavailable') {
                        connectStatus.textContent = '❌ Комната не найдена. Проверьте код.';
                        connectStatus.style.color = '#e74c3c';
                        feedback.textContent = '❌ Комната не найдена.';
                        feedback.className = 'feedback error';
                    }
                    createBtn.style.display = 'inline-block';
                    joinBtn.style.display = 'inline-block';
                    leaveBtn.classList.add('hidden');
                    if (peer) { try { peer.destroy(); } catch (e) {} }
                    peer = null;
                }
            });

            peer.on('disconnected', () => {
                console.log('Peer отключён');
                if (isConnected) {
                    isConnected = false;
                    statusDot.className = 'status-dot offline';
                    connectStatus.textContent = '❌ Соединение потеряно';
                    connectStatus.style.color = '#e74c3c';
                    addChat('🔌 Соединение потеряно', 'system');
                }
            });
        }

        function setupConnection(c) {
            conn = c;
            isConnected = true;
            isConnecting = false;
            statusDot.className = 'status-dot online';
            leaveBtn.classList.remove('hidden');
            createBtn.style.display = 'none';
            joinBtn.style.display = 'none';
            chatInput.disabled = false;
            chatSend.disabled = false;

            if (!isHost) {
                roomCodeDisplay.textContent = room;
                roomDisplay.style.display = 'inline-flex';
                roomInfo.innerHTML = '🏠 Подключено к комнате <strong>' + room + '</strong>';
                connectStatus.textContent = '✅ Подключено!';
                connectStatus.style.color = '#2ecc71';
                feedback.textContent = '✅ Подключено к комнате ' + room;
                feedback.className = 'feedback success';
                addChat('👋 Вы вошли как <strong>' + myName + '</strong>', 'system');
            } else {
                addChat('👤 Игрок подключился!', 'system');
                setTimeout(() => {
                    players[myId] = { name: myName, guessed: false };
                    updateOnline();
                    syncGame();
                }, 300);
            }

            c.on('data', (data) => {
                handlePeerData(data);
            });

            c.on('close', () => {
                isConnected = false;
                statusDot.className = 'status-dot offline';
                connectStatus.textContent = '❌ Соединение разорвано';
                connectStatus.style.color = '#e74c3c';
                addChat('🔌 Соединение разорвано', 'system');
                feedback.textContent = '❌ Соединение разорвано';
                feedback.className = 'feedback error';
                leaveRoom();
            });
        }

        function handlePeerData(data) {
            console.log('Получено:', data);

            switch (data.type) {
                case 'join':
                    if (data.data && data.data.id) {
                        players[data.data.id] = { name: data.data.name, guessed: false };
                        updateOnline();
                        addChat('👤 <strong>' + data.data.name + '</strong> присоединился', 'system');
                        syncGame();
                    }
                    break;

                case 'sync':
                    if (data.data && !isHost) {
                        const d = data.data;
                        if (d.film && d.filmId) {
                            film = d.film;
                            filmId = d.filmId;
                            guessed = d.guessed || false;
                            showFilm(film);
                            if (guessed) {
                                const name = film.nameRu || film.nameEn || 'Без названия';
                                revealTitle(name);
                                guessInput.disabled = true;
                                guessBtn.disabled = true;
                                feedback.textContent = '🎯 Фильм уже угадан!';
                                feedback.className = 'feedback success';
                            } else {
                                kpFrames(filmId).then(fr => { if (fr.length) showFrames(fr); });
                                guessInput.disabled = false;
                                guessBtn.disabled = false;
                            }
                        }
                        if (d.players) {
                            players = d.players;
                            updateOnline();
                        }
                    }
                    break;

                case 'guess':
                    if (data.data) {
                        if (data.data.win) {
                            addChat('🎯 <strong>' + data.data.name + '</strong> угадал!', 'system');
                            if (data.data.name !== myName) {
                                guessed = true;
                                const name = film?.nameRu || film?.nameEn || 'Без названия';
                                revealTitle(name);
                                guessInput.disabled = true;
                                guessBtn.disabled = true;
                                feedback.textContent = '🎯 ' + data.data.name + ' угадал!';
                                feedback.className = 'feedback success';
                            }
                        } else {
                            addChat('❌ <strong>' + data.data.name + '</strong>: ' + data.data.guess + ' — не угадал', '');
                        }
                    }
                    break;

                case 'skip':
                    if (data.data) {
                        addChat('⏭️ <strong>' + data.data.name + '</strong> пропустил. Это был "' + data.data.title + '"',
                            'system');
                        if (data.data.name !== myName && film) {
                            const name = film.nameRu || film.nameEn || 'Без названия';
                            revealTitle(name);
                            guessed = true;
                            guessInput.disabled = true;
                            guessBtn.disabled = true;
                            feedback.textContent = '⏭️ ' + data.data.name + ' пропустил. Это "' + name + '"';
                            feedback.className = 'feedback info';
                        }
                    }
                    break;

                case 'chat':
                    if (data.data) {
                        addChat('💬 <strong>' + data.data.name + '</strong>: ' + data.data.message, '');
                    }
                    break;

                case 'player_left':
                    if (data.data && data.data.id) {
                        delete players[data.data.id];
                        updateOnline();
                        addChat('👤 <strong>' + data.data.name + '</strong> покинул комнату', 'system');
                    }
                    break;
            }
        }

        // ---------- УПРАВЛЕНИЕ КОМНАТОЙ ----------
        function createRoom() {
            const code = roomInput.value.trim();
            if (!code || !/^\d{4}$/.test(code)) {
                feedback.textContent = '❌ Введите 4 цифры';
                feedback.className = 'feedback error';
                return;
            }
            if (!getOmdb() || !getKp()) {
                feedback.textContent = '❌ Введите API ключи';
                feedback.className = 'feedback error';
                return;
            }

            room = code;
            isHost = true;
            isConnecting = true;
            players = {};
            players[myId] = { name: myName, guessed: false };
            updateOnline();

            roomCodeDisplay.textContent = code;
            roomDisplay.style.display = 'inline-flex';
            statusDot.className = 'status-dot waiting';
            createBtn.style.display = 'none';
            joinBtn.style.display = 'none';
            leaveBtn.classList.remove('hidden');
            chatInput.disabled = true;
            chatSend.disabled = true;
            roomInfo.innerHTML = '🏠 Создание комнаты <strong>' + code + '</strong>...';
            connectStatus.textContent = '⏳ Подключение к серверу...';
            connectStatus.style.color = '#f39c12';
            feedback.textContent = '⏳ Создание комнаты...';
            feedback.className = 'feedback loading';

            initPeer();
        }

        function joinRoom() {
            const code = roomInput.value.trim();
            if (!code || !/^\d{4}$/.test(code)) {
                feedback.textContent = '❌ Введите 4 цифры';
                feedback.className = 'feedback error';
                return;
            }
            if (!getOmdb() || !getKp()) {
                feedback.textContent = '❌ Введите API ключи';
                feedback.className = 'feedback error';
                return;
            }

            room = code;
            isHost = false;
            isConnecting = true;
            players = {};
            players[myId] = { name: myName, guessed: false };
            updateOnline();

            roomCodeDisplay.textContent = code;
            roomDisplay.style.display = 'inline-flex';
            statusDot.className = 'status-dot waiting';
            createBtn.style.display = 'none';
            joinBtn.style.display = 'none';
            leaveBtn.classList.remove('hidden');
            chatInput.disabled = true;
            chatSend.disabled = true;
            roomInfo.innerHTML = '🏠 Подключение к комнате <strong>' + code + '</strong>...';
            connectStatus.textContent = '⏳ Подключение...';
            connectStatus.style.color = '#f39c12';
            feedback.textContent = '⏳ Подключение к комнате...';
            feedback.className = 'feedback loading';

            if (peer) {
                try { peer.destroy(); } catch (e) {}
                peer = null;
            }

            peer = new Peer(undefined, {
                debug: 0,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            if (connectTimeout) clearTimeout(connectTimeout);
            connectTimeout = setTimeout(() => {
                if (!isConnected && isConnecting) {
                    isConnecting = false;
                    connectStatus.textContent = '❌ Таймаут подключения. Проверьте код.';
                    connectStatus.style.color = '#e74c3c';
                    feedback.textContent = '❌ Таймаут подключения';
                    feedback.className = 'feedback error';
                    createBtn.style.display = 'inline-block';
                    joinBtn.style.display = 'inline-block';
                    leaveBtn.classList.add('hidden');
                    if (peer) { try { peer.destroy(); } catch (e) {} }
                    peer = null;
                }
            }, 10000);

            peer.on('open', (id) => {
                console.log('Peer открыт:', id);
                isConnecting = false;
                if (connectTimeout) clearTimeout(connectTimeout);

                const c = peer.connect(code);
                if (c) {
                    conn = c;
                    setupConnection(c);
                    c.on('open', () => {
                        c.send({ type: 'join', data: { id: myId, name: myName } });
                        setTimeout(() => {
                            c.send({ type: 'sync', data: { request: true } });
                        }, 300);
                    });
                } else {
                    connectStatus.textContent = '❌ Не удалось подключиться';
                    connectStatus.style.color = '#e74c3c';
                    feedback.textContent = '❌ Не удалось подключиться';
                    feedback.className = 'feedback error';
                    leaveRoom();
                }
            });

            peer.on('error', (err) => {
                console.error('Peer ошибка:', err);
                if (isConnecting) {
                    isConnecting = false;
                    if (err.type === 'peer-unavailable') {
                        connectStatus.textContent = '❌ Комната не найдена. Проверьте код.';
                        connectStatus.style.color = '#e74c3c';
                        feedback.textContent = '❌ Комната не найдена';
                        feedback.className = 'feedback error';
                    }
                    createBtn.style.display = 'inline-block';
                    joinBtn.style.display = 'inline-block';
                    leaveBtn.classList.add('hidden');
                    if (peer) { try { peer.destroy(); } catch (e) {} }
                    peer = null;
                }
            });
        }

        function leaveRoom() {
            if (conn) {
                try {
                    conn.send({ type: 'player_left', data: { id: myId, name: myName } });
                    conn.close();
                } catch (e) {}
                conn = null;
            }
            if (peer) {
                try { peer.destroy(); } catch (e) {}
                peer = null;
            }

            isConnected = false;
            isHost = false;
            isConnecting = false;
            room = null;
            players = {};
            if (connectTimeout) clearTimeout(connectTimeout);

            roomCodeDisplay.textContent = '----';
            roomDisplay.style.display = 'none';
            statusDot.className = 'status-dot offline';
            createBtn.style.display = 'inline-block';
            joinBtn.style.display = 'inline-block';
            leaveBtn.classList.add('hidden');
            chatInput.disabled = true;
            chatSend.disabled = true;
            roomInfo.innerHTML = '💡 Создайте комнату (4 цифры)';
            connectStatus.textContent = '';
            feedback.textContent = '💡 Вы покинули комнату';
            feedback.className = 'feedback info';
            updateOnline();
            addChat('🔌 Вы покинули комнату', 'system');
        }

        createBtn.onclick = createRoom;
        joinBtn.onclick = joinRoom;
        leaveBtn.onclick = leaveRoom;

        roomInput.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '').slice(0, 4);
        });

        // ---------- ЧАТ ----------
        chatSend.onclick = function() {
            const msg = chatInput.value.trim();
            if (!msg || !isConnected) return;
            sendToPeer('chat', { name: myName, message: msg });
            addChat('💬 <strong>' + myName + '</strong>: ' + msg, '');
            chatInput.value = '';
        };

        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && this.value.trim() && isConnected) {
                e.preventDefault();
                chatSend.click();
            }
        });

        // ---------- ИНИЦИАЛИЗАЦИЯ ----------
        if (localStorage.getItem('omdb')) omdbKey.value = localStorage.getItem('omdb');
        if (localStorage.getItem('kp')) kpKey.value = localStorage.getItem('kp');

        setTimeout(() => {
            if (getOmdb() && getKp()) testBtn.click();
        }, 500);

        console.log('🎬 Угадай фильм — БЕЗ ПОДСКАЗОК И КНОПКИ «ПОДБОР»');
        console.log('👤 Ваш ID:', myId);
    </script>
</body>
